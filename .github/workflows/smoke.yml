name: smoke

on:
  push:
    branches: [main]
  pull_request:

jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    # smoke.sh 는 HOME 을 임시 폴더로 바꿔 전역 git 설정이 보이지 않는다. 테스트 안의 커밋용 작성자 정보
    env:
      GIT_AUTHOR_NAME: ci
      GIT_AUTHOR_EMAIL: ci@example.com
      GIT_COMMITTER_NAME: ci
      GIT_COMMITTER_EMAIL: ci@example.com
    steps:
      - uses: actions/checkout@v4
      # macOS 는 PATH 에 Homebrew bash 5 가 먼저 잡힐 수 있어, 기본 /bin/bash(3.2)로 호환 규칙까지 확인한다
      - name: smoke (macOS, /bin/bash 3.2)
        if: runner.os == 'macOS'
        run: /bin/bash tests/smoke.sh
      - name: smoke (Linux)
        if: runner.os == 'Linux'
        run: bash tests/smoke.sh
